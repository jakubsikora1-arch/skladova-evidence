name: Deploy static webapp to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate application files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f assets/app-icon.png
          grep -q '<html lang="cs">' index.html
          grep -q 'id="themeToggle"' index.html
          grep -q '⌀' index.html
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('app.js', 'utf8');
          const match = source.match(/const EXPECTED = (\[[\s\S]*?\]);/);
          if (!match) throw new Error('Seznam EXPECTED nebyl nalezen.');
          const items = JSON.parse(match[1]);
          if (items.length !== 50) {
            throw new Error(`Očekáváno 50 položek, nalezeno ${items.length}.`);
          }
          console.log(`Kontrola OK: ${items.length} skladových položek.`);
          NODE

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html styles.css app.js _site/
          cp assets/app-icon.png _site/assets/
          test -s _site/index.html
          test -s _site/assets/app-icon.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
